<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futures Market Week Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        h1 { color: #fff; text-align: center; font-size: 1.8rem; margin-bottom: 6px; }
        .subtitle { color: #8892b0; text-align: center; font-size: 0.85rem; margin-bottom: 24px; }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status.open { background: rgba(0,255,136,0.15); color: #0f8; }
        .status.closed { background: rgba(255,82,82,0.15); color: #f55; }

        .week-pct {
            text-align: center;
            padding: 16px;
            background: rgba(100,255,218,0.08);
            border-radius: 14px;
            margin-bottom: 20px;
        }
        .week-pct .value { color: #64ffda; font-size: 2.2rem; font-weight: 700; }
        .week-pct .label { color: #8892b0; font-size: 0.8rem; margin-top: 4px; }

        .countdown {
            background: rgba(102,126,234,0.1);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .countdown-title { color: #ccd6f6; font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; }
        .countdown-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
        .countdown-item {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .countdown-item .tf { color: #8892b0; font-size: 0.65rem; text-transform: uppercase; }
        .countdown-item .num { color: #64ffda; font-size: 1.2rem; font-weight: 700; }

        .bar-item { margin-bottom: 16px; }
        .bar-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .bar-label { color: #ccd6f6; font-size: 0.85rem; }
        .bar-value { color: #64ffda; font-size: 0.8rem; font-weight: 600; }
        .now-badge {
            background: rgba(100,255,218,0.2);
            color: #64ffda;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            margin-left: 8px;
        }

        .bar-container {
            height: 24px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 12px;
            position: relative;
            z-index: 1;
            transition: width 0.5s ease;
        }
        .bar-1 .bar-fill { background: linear-gradient(90deg, #667eea, #764ba2); }
        .bar-2 .bar-fill { background: linear-gradient(90deg, #f093fb, #f5576c); }
        .bar-3 .bar-fill { background: linear-gradient(90deg, #4facfe, #00f2fe); }
        .bar-4 .bar-fill { background: linear-gradient(90deg, #43e97b, #38f9d7); }
        .bar-5 .bar-fill { background: linear-gradient(90deg, #fa709a, #fee140); }

        .bar-times {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            padding: 0 2px;
        }
        .bar-times span { font-size: 0.55rem; color: #8892b099; }

        .time-display {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .time-display .time { color: #ccd6f6; font-size: 1.1rem; font-weight: 600; }
        .time-display .tz { color: #8892b0; font-size: 0.8rem; margin-top: 4px; }

        .candle-dropdown { margin-top: 8px; display: none; }
        .candle-dropdown.show { display: block; }
        .candle-toggle {
            width: 100%;
            padding: 10px 14px;
            background: rgba(100,255,218,0.1);
            border: none;
            border-radius: 10px;
            color: #64ffda;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
        }
        .candle-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .candle-content.open { max-height: 350px; padding: 12px 0; }
        .time-remaining {
            background: rgba(100,255,218,0.1);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .time-remaining .lbl { color: #8892b0; font-size: 0.75rem; }
        .time-remaining .val { color: #64ffda; font-size: 0.9rem; font-weight: 600; }
        .candle-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .candle-row:last-child { border: none; }
        .candle-row .tf { color: #8892b0; width: 35px; }
        .candle-row .info { color: #ccd6f6; }
        .candle-row .next { color: #64ffda; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Futures Market Week Tracker</h1>
        <p class="subtitle">Sunday 5PM CT - Friday 4PM CT (115 Hours)</p>

        <div class="status" id="status">Market Open</div>

        <div class="week-pct">
            <div class="value" id="weekPct">0%</div>
            <div class="label">of trading week complete</div>
        </div>

        <div class="countdown">
            <div class="countdown-title">Candles Remaining This Week</div>
            <div class="countdown-grid" id="weeklyCandles"></div>
        </div>

        <div id="bars"></div>

        <div class="time-display">
            <div class="time" id="currentTime">--</div>
            <div class="tz">Central Time (CT)</div>
        </div>
    </div>

    <script>
        const BARS = [
            { label: 'Sunday 5PM - Monday 4PM CT', hours: 23 },
            { label: 'Monday 5PM - Tuesday 4PM CT', hours: 23 },
            { label: 'Tuesday 5PM - Wednesday 4PM CT', hours: 23 },
            { label: 'Wednesday 5PM - Thursday 4PM CT', hours: 23 },
            { label: 'Thursday 5PM - Friday 4PM CT', hours: 23 }
        ];
        const TIMES = ['5PM','9PM','1AM','5AM','9AM','1PM','4PM'];
        const TFS = [{l:'4H',m:240},{l:'1H',m:60},{l:'30M',m:30},{l:'15M',m:15},{l:'5M',m:5},{l:'1M',m:1}];
        const MS_HR = 3600000;
        const TOTAL_MS = BARS.reduce((a,b) => a + b.hours * MS_HR, 0);

        let expanded = null;

        function getCT() {
            return new Date(new Date().toLocaleString("en-US", {timeZone: "America/Chicago"}));
        }

        function getWeekStart(ct) {
            const d = ct.getDay(), h = ct.getHours();
            let back = d;
            if (d === 0 && h < 17) back = 7;
            if (d === 6) back = 6;
            const ws = new Date(ct);
            ws.setDate(ct.getDate() - back);
            ws.setHours(17, 0, 0, 0);
            return ws;
        }

        function isOpen(ct) {
            const d = ct.getDay(), h = ct.getHours(), t = h + ct.getMinutes()/60;
            if (d === 6) return false;
            if (d === 0 && t < 17) return false;
            if (d === 5 && t >= 16) return false;
            // Daily break: 4PM-5PM CT (hour 16)
            if (h === 16 && d >= 1 && d <= 4) return false;
            return true;
        }

        function fmt(ms) {
            if (ms <= 0) return '0s';
            const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
            if (h > 0) return `${h}h ${m}m ${s}s`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        function fmtShort(ms) {
            if (ms <= 0) return '0s';
            const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
            if (h > 0) return `${h}h ${m}m`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        function init() {
            const wc = document.getElementById('weeklyCandles');
            wc.innerHTML = TFS.map(tf => `
                <div class="countdown-item">
                    <div class="tf">${tf.l}</div>
                    <div class="num" id="wk${tf.l}">--</div>
                </div>
            `).join('');

            const barsEl = document.getElementById('bars');
            barsEl.innerHTML = BARS.map((b,i) => `
                <div class="bar-item bar-${i+1}">
                    <div class="bar-header">
                        <span class="bar-label">${b.label}<span class="now-badge" id="badge${i}" style="display:none">NOW</span></span>
                        <span class="bar-value" id="val${i}">0%</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" id="fill${i}"></div>
                    </div>
                    <div class="bar-times">${TIMES.map(t => `<span>${t}</span>`).join('')}</div>
                    <div class="candle-dropdown" id="dd${i}">
                        <button class="candle-toggle" onclick="toggle(${i})">▼ Candle Countdown</button>
                        <div class="candle-content" id="cc${i}"></div>
                    </div>
                </div>
            `).join('');
        }

        function toggle(i) {
            const cc = document.getElementById(`cc${i}`);
            if (expanded === i) {
                cc.classList.remove('open');
                expanded = null;
            } else {
                if (expanded !== null) document.getElementById(`cc${expanded}`).classList.remove('open');
                cc.classList.add('open');
                expanded = i;
            }
        }

        function update() {
            const ct = getCT();
            const ws = getWeekStart(ct);
            const elapsed = Math.max(0, Math.min(TOTAL_MS, ct - ws));
            const pct = (elapsed / TOTAL_MS) * 100;
            const open = isOpen(ct);

            const st = document.getElementById('status');
            st.textContent = open ? 'Market Open' : 'Market Closed';
            st.className = 'status ' + (open ? 'open' : 'closed');

            document.getElementById('weekPct').textContent = pct.toFixed(1) + '%';

            const remMin = (TOTAL_MS - elapsed) / 60000;
            TFS.forEach(tf => {
                document.getElementById(`wk${tf.l}`).textContent = Math.ceil(remMin / tf.m);
            });

            let cumMs = 0;
            BARS.forEach((b, i) => {
                const barMs = b.hours * MS_HR;
                const barEnd = cumMs + barMs;
                let prog = 0, active = false;

                if (elapsed >= barEnd) prog = 100;
                else if (elapsed > cumMs) {
                    prog = ((elapsed - cumMs) / barMs) * 100;
                    active = true;
                }

                document.getElementById(`fill${i}`).style.width = prog + '%';
                document.getElementById(`val${i}`).textContent = prog.toFixed(1) + '%';
                document.getElementById(`badge${i}`).style.display = (active && open) ? 'inline' : 'none';

                const dd = document.getElementById(`dd${i}`);
                if (active && open) {
                    dd.classList.add('show');
                    const barRemMs = barEnd * MS_HR / MS_HR - elapsed + cumMs * 0;
                    const timeLeftMs = (barEnd - elapsed);
                    const barRemMin = timeLeftMs / 60000;

                    let html = `<div class="time-remaining">
                        <span class="lbl">Time left today:</span>
                        <span class="val">${fmt(timeLeftMs)}</span>
                    </div>`;

                    html += TFS.map(tf => {
                        const rem = Math.ceil(barRemMin / tf.m);
                        const msCandle = tf.m * 60000;
                        const msNext = msCandle - (ct.getTime() % msCandle);
                        return `<div class="candle-row">
                            <span class="tf">${tf.l}</span>
                            <span class="info">${rem} left</span>
                            <span class="next">Next: ${fmtShort(msNext)}</span>
                        </div>`;
                    }).join('');

                    document.getElementById(`cc${i}`).innerHTML = html;
                } else {
                    dd.classList.remove('show');
                }

                cumMs = barEnd;
            });

            document.getElementById('currentTime').textContent =
                ct.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'}) +
                ' - ' + ct.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        }

        init();
        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
